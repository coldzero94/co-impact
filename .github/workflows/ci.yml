name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.classify.outputs.app }}
    steps:
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Files of exactly this commit, old and new path for renames. The compare API lists at most 300 files: treat more as code.
          files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$SHA" --jq 'if (.files | length) >= 300 then "(300+ files: treated as code)" else (.files[] | .filename, (.previous_filename // empty) | gsub("\n"; "\\n")) end')
          [ -n "$files" ] || { echo "::error::PR has no changed files"; exit 1; }
          printf '%s\n' "$files"
          # App code: everything except docs/, Markdown, agent/CI tooling, and .gitignore. grep exit 2 (error) fails the step.
          # shortcut: CI-only changes skip the ios job until Impact.xcodeproj exists (roadmap step 3); then stop excluding .github/workflows/ci.yml here.
          app=$(printf '%s\n' "$files" | grep -vE '^docs/|\.md$|^\.github/|^\.claude/|^\.agents/|^skills-lock\.json$|^\.gitignore$' || [ $? -eq 1 ])
          echo "app=$([ -n "$app" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  ios:
    needs: changes
    if: needs.changes.outputs.app != 'false'
    runs-on: xcode-27   # preview image (actions/runner-images#14404)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: xcodebuild -version
      - name: Build and test
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          [[ "$udid" =~ ^[0-9A-F-]{36}$ ]] || { echo "::error::No available iPhone simulator"; exit 1; }
          xcodebuild test \
            -project Impact.xcodeproj \
            -scheme Impact \
            -destination "id=$udid" \
            CODE_SIGNING_ALLOWED=NO
