name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git diff --name-only "$BASE...$HEAD")
          echo "$files"
          # Docs: anything under docs/ and Markdown files at the repo root.
          non_docs=$(echo "$files" | grep -vE '^docs/|^[^/]+\.md$' || true)
          # App: everything that is not docs or agent/CI tooling.
          # shortcut: CI-file changes don't run the iOS build until the Xcode project exists (roadmap step 3); add .github/workflows/ci.yml here then.
          app=$(echo "$non_docs" | grep -vE '^\.github/|^\.claude/|^\.agents/|^skills-lock\.json$|^\.gitignore$' || true)
          echo "docs_only=$([ -z "$non_docs" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "app=$([ -n "$app" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Docs-only PRs skip the agent review gate (AGENTS.md → Merge policy).
  docs-review-exempt:
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - run: |
          for ctx in review/ponytail review/pr-review-toolkit; do
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
              -f state=success -f context="$ctx" -f description="Docs-only change: review not required"
          done

  ios:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27   # preview image (actions/runner-images#14404)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Build and test
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild test \
            -project Impact.xcodeproj \
            -scheme Impact \
            -destination "id=$udid" \
            CODE_SIGNING_ALLOWED=NO
