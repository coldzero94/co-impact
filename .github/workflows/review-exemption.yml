name: Review exemption

# pull_request_target runs main's copy of this file, so a PR cannot change the rule that exempts it,
# and fork PRs get a token that can post statuses. Never check out or run PR code in this workflow.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  statuses: write

jobs:
  classify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: ${{ github.event.pull_request.base.ref }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Post review statuses if docs-only
        run: |
          # PR files at exactly this head SHA (merge base with current main...SHA), old and new path for renames.
          # Newlines in names are escaped so one name can't split into several lines. The compare API lists at most
          # 300 files: 300 or more are never treated as docs or tooling. Same listing in ci.yml, review-exemption.yml, and the merge-gate skill; change all together.
          files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$SHA" --jq 'if (.files | length) >= 300 then "(300+ files: treated as code)" else (.files[] | .filename, (.previous_filename // empty) | gsub("\n"; "\\n")) end')
          [ -n "$files" ] || { echo "::error::PR has no changed files"; exit 1; }
          printf '%s\n' "$files"
          # Docs-only = docs/** and README.md, with no agent instruction file at any depth or letter case (those load as agent rules)
          # and no non-ASCII name (a case-insensitive disk can resolve one to an agent file).
          non_docs=$(printf '%s\n' "$files" | grep -avE '^docs/|^README\.md$' || [ $? -eq 1 ])
          agent=$(printf '%s\n' "$files" | grep -aiE '(^|/)(AGENTS|AGENTS\.override|CLAUDE|CLAUDE\.local)\.md$|(^|/)\.(claude|agents)(/|$)' || [ $? -eq 1 ])
          odd=$(printf '%s\n' "$files" | LC_ALL=C grep -a '[^ -~]' || [ $? -eq 1 ])
          if [ -n "$non_docs$agent$odd" ]; then echo "::notice::Not docs-only: the merge-gate review applies."; exit 0; fi
          for ctx in review/ponytail review/pr-review-toolkit; do
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=success -f context="$ctx" \
              -f description="Docs-only change: review not required" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done
